name: Build AudioPlayer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-13
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Download ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ff -Force
          $bin = (Get-ChildItem ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          Copy-Item "$bin\ffmpeg.exe" .
          Copy-Item "$bin\ffprobe.exe" .

      - name: Download ffmpeg (Mac)
        if: runner.os == 'macOS'
        run: |
          curl -L -o ffmpeg.zip https://evermeet.cx/ffmpeg/getrelease/zip
          curl -L -o ffprobe.zip https://evermeet.cx/ffmpeg/getrelease/ffprobe/zip
          unzip -o ffmpeg.zip
          unzip -o ffprobe.zip
          chmod +x ffmpeg ffprobe

      - name: Build Windows program
        if: runner.os == 'Windows'
        run: >
          pyinstaller --onefile --windowed --name AudioPlayer
          --add-binary "ffmpeg.exe;." --add-binary "ffprobe.exe;."
          audio_player.py

      - name: Build Mac program
        if: runner.os == 'macOS'
        run: >
          pyinstaller --windowed --name AudioPlayer
          --add-binary "ffmpeg:." --add-binary "ffprobe:."
          audio_player.py

      - name: Package Windows file
        if: runner.os == 'Windows'
        shell: pwsh
        run: Rename-Item dist\AudioPlayer.exe AudioPlayer-Windows.exe

      - name: Package Mac file
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent AudioPlayer.app AudioPlayer-Mac.zip

      - name: Publish Windows file to release
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AudioPlayer-Windows.exe

      - name: Publish Mac file to release
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AudioPlayer-Mac.zip
